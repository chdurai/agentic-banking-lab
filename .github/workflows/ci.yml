name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React workbench
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # Offline thresholds fail closed; this is not evidence of live-model/judge performance.
      - name: Release evaluations (deterministic model only)
        run: mvn -B -Dtest=ReleaseEvaluationGateTest,SafetyEvaluationTest,SafetyCorpusContractTest,SafetyCorpusStubbedTest test

      - name: Upload release evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-safety-evaluation
          path: |
            target/safety-eval-report.json
            target/release-eval-report.json
            target/surefire-reports/*ReleaseEvaluation*.xml
            target/surefire-reports/*Safety*.xml
            target/surefire-reports/*Safety*.txt
          if-no-files-found: error

      - name: Build and test
        run: mvn -B verify

      - name: Check isolated workbench behavior
        run: node --test src/test/ui/workbench-behavior.test.cjs

      - name: Upload synthetic interview PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-interview-poc-contracts
          path: |
            target/showcase-contract-report.json
            target/showcase-retrieval-report.json
            target/surefire-reports/*ShowcaseContractTest.*
            target/surefire-reports/*ShowcaseRetrievalTest.*
          if-no-files-found: error

      - name: Upload durable execution and alert contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-durable-execution-contracts
          path: |
            target/surefire-reports/*FlowExecutionJournalTest.*
            target/surefire-reports/*DurableAlertQueueTest.*
            target/surefire-reports/*LoanRecoveryProcessTest.*
            target/surefire-reports/*LoanRecoveryFlowTest.*
          if-no-files-found: error

      - name: Compile Azure authoring baseline (no deployment)
        run: az bicep build --file deploy/azure/containerapp.bicep --outfile "${RUNNER_TEMP}/containerapp.json"

      - name: Upload offline agent-value evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-agent-ablations
          path: |
            target/ablation-report.json
            target/surefire-reports/*Ablation*.xml
            target/surefire-reports/*Ablation*.txt
          if-no-files-found: error

      - name: Upload local MCR journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-mcr-acceptance
          path: |
            target/surefire-reports/*McrLoanAcceptanceTest.xml
            target/surefire-reports/*McrLoanAcceptanceTest.txt
          if-no-files-found: error

      - name: Upload document and challenge evidence contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-challenge-contracts
          path: |
            target/surefire-reports/*Document*.xml
            target/surefire-reports/*Grounding*.xml
            target/surefire-reports/*Challenge*.xml
          if-no-files-found: error

      - name: Upload durable case spending contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-case-spending
          path: |
            target/surefire-reports/*JdbcCaseSpendLedgerTest.xml
            target/surefire-reports/*JdbcGatewaySpendingTest.xml
            target/surefire-reports/*CaseBudgetReservationTest.xml
          if-no-files-found: error

      - name: Upload prompt and challenge measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-challenge-measurements
          path: |
            target/declared-reads-report.json
            target/targeted-challenge-report.json
            target/surefire-reports/*DeclaredReadsEvaluationTest.xml
            target/surefire-reports/*TargetedChallengeEvaluationTest.xml
          if-no-files-found: error

      - name: Upload shared provider health contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-provider-health
          path: |
            target/surefire-reports/*JdbcProviderHealthBudgetTest.xml
            target/surefire-reports/*JdbcSharedProviderHealthFlowTest.xml
            target/surefire-reports/*ProviderErrorBudgetFlowTest.xml
          if-no-files-found: error

      - name: Upload seeded-defect measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-defect-evidence
          path: |
            target/seeded-defect-report.json
            target/surefire-reports/*SeededDefectEvaluationTest.xml
          if-no-files-found: error

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t agentic-banking:${{ github.sha }} .

      # CD extension point: push to ACR + deploy to Azure Container Apps / AKS
      # - name: Push to Azure Container Registry
      #   run: |
      #     az acr login --name $ACR_NAME
      #     docker tag agentic-banking:${{ github.sha }} $ACR_NAME.azurecr.io/agentic-banking:${{ github.sha }}
      #     docker push $ACR_NAME.azurecr.io/agentic-banking:${{ github.sha }}
