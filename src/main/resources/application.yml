spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: agentic-banking
  ai:
    # Active chat provider: openai (NIM, default) | azure-openai (profile: azure)
    model:
      chat: openai
      embedding: openai
    # MCP client: disabled by default; enable and point at MCP tool servers to give
    # agents access to enterprise tools (ServiceNow, Jira, internal APIs)
    mcp:
      server:
        name: agentic-banking-platform
        version: 1.0.0
        type: SYNC
      client:
        enabled: ${MCP_ENABLED:false}
        name: agentic-banking
        type: SYNC
    # Placeholder defaults so the Azure client-builder bean can construct while the
    # Azure chat model stays disabled; real values come from the `azure` profile.
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://placeholder.openai.azure.com}
        api-key: ${AZURE_OPENAI_API_KEY:not-configured}
    # The gateway owns retries; disable Spring AI's hidden 10-attempt internal retry
    retry:
      max-attempts: 1
    openai:
      # NVIDIA NIM hosted API (build.nvidia.com) - OpenAI-compatible
      base-url: https://integrate.api.nvidia.com
      api-key: ${NVIDIA_API_KEY:demo-key-not-set}
      chat:
        options:
          model: nvidia/llama-3.1-nemotron-70b-instruct
          temperature: 0.2
          max-tokens: 2048
      # Used only when agents.rag-mode=vector
      embedding:
        options:
          model: nvidia/nemotron-3.5-embed-8b

platform:
  loan:
    investigation:
      enabled: false               # optional synthetic read-only investigation; requires JDBC and durable case API
    recovery-simulation: false      # synthetic-data/JDBC demo only; never moves funds; explicit receipt reconciliation
  documents:
    pdf:
      enabled: false                # opt-in local embedded-text extraction; scanned/image OCR still requires review
  callers:
    required: ${PLATFORM_CALLERS_REQUIRED:false}
    credentials: {}                # bind server-side tenant/actor/roles; secrets must come from environment/secret store
    mcp-client-allowlist: []         # exact HTTPS SSE server base URLs; outbound MCP remains disabled
  cases:
    worker-enabled: true
    poll-ms: 1000
    max-inflight: 8                 # per replica; queued work is claimed with database compare-and-swap
    max-run-ms: 180000              # expired execution is FAILED/uncertain, never automatically replayed
  # LLM gateway (WI-06): every model call goes through io.github.chdurai.agenticbanking.llm.LlmGateway
  llm:
    provider: nvidia-nim            # logical name used in breaker/metric keys
    # Optional provider health gate across all routes; thresholds need live calibration.
    provider-error-budget:
      enabled: false
      shared: false                # opt-in JDBC cross-replica circuit; all replicas must use identical settings
      failure-rate-percent: 50
      sliding-window-size: 20
      minimum-calls: 10
      wait-open-ms: 30000
      half-open-calls: 1
    # This account only has the Lightning route, so primary == fallback. The gateway
    # refuses to start in that state unless acknowledged here. Set false in production
    # and give each agent a distinct fallback (platform.llm.routes.<agent>.fallback).
    allow-fallback-equals-primary: true
    providers:
      approved: []                  # non-empty list is enforced at startup (data residency / vendor approval)
    governance:
      region: ${LLM_REVIEWED_REGION:}
      no-training: ${LLM_NO_TRAINING_REVIEWED:false}
      retention-reviewed: ${LLM_RETENTION_REVIEWED:false}
      terms-reference: ${LLM_TERMS_REFERENCE:}
      approved-endpoints: []        # approve actual chat and vector embedding URLs, not just logical provider names
    resilience:
      kill-switch: false            # true = no LLM calls; flows degrade to deterministic / human review
      timeout-ms: 60000             # hard per-call deadline (the call is cancelled, never left hanging)
      retry: {max: 2, initial-backoff-ms: 500, multiplier: 2.0, jitter: 0.3}   # 429 / 5xx / transport only
      breaker: {failure-rate-percent: 50, sliding-window-size: 20, minimum-calls: 10, wait-open-ms: 30000, half-open-calls: 3}
      bulkhead: {max-concurrent: 16, max-wait-ms: 2000}
      quota: {tpm: 0}               # estimated tokens/minute; shared fixed window with JDBC, local sliding window otherwise
    # routes:                       # optional per-agent override of agents.models / agents.fallback-model
    #   decision: {primary: gpt-4o, fallback: gpt-4o-mini, temperature: 0.1, prompt-version: v2}
    # budget:
    #   per-case:
    #     loan: {max-tokens: 60000, max-cost-usd: 0.50, max-ms: 120000}
  # Durable audit store for platform events: memory (default) | jdbc (Postgres/H2)
  persistence: ${PLATFORM_PERSISTENCE:memory}
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:h2:file:./data/platform}
    username: ${PLATFORM_DB_USER:sa}
    password: ${PLATFORM_DB_PASSWORD:}
  security:
    # Optional additional legacy service guard; tenant identity comes from platform.callers bearer credentials.
    api-key: ${PLATFORM_API_KEY:}
  # Loan policy-as-code (WI-01): single source of truth for decision floors, pricing and caps
  # Durable cases (WI-02): Idempotency-Key on POST /api/loans/evaluate; outbox relay interval
  idempotency:
    required: false   # set true in production
  outbox:
    relay-interval-ms: 2000
  retention:
    case-days: 2555
    episodic-days: 90
    sensitive-days: 30
    replay-vault-days: 14
    purge-interval-ms: 3600000
  grievance:
    insights:
      enabled: false   # opt-in, tenant-scoped cohort reporting; not a production privacy certification
      minimum-group-size: 5
  hitl:
    auth: dev            # "required" = authenticated reviewer id + role enforcement + four-eyes
    enforce-roles: false
    blind-first-sample-rate: 0.0   # 0..1; sampled approvals hide AI evidence until independent reviewer input is recorded
    blind-first-flows: [loan, incident, grievance, document, compliance]
    non-trivial-risk-min-score: 60
    default-ttl-hours: 24
    sweep-interval-ms: 60000
  flow:
    state: legacy        # "v2" = typed append-only findings, declared-reads prompts, Spotlight everywhere
    max-narrative-chars: 600
    runtime: legacy      # "dag" = agents start as soon as the agents they read are done (WI-35)
    per-node-deadline-ms: 120000
    max-plan-nodes: 8
    max-llm-calls: 6
    challenge: legacy    # "v2" = detector-first bounded challenge protocol instead of the one-shot critic loop (WI-36)
    max-rounds: 2
    max-challenges-per-finding: 1
    autonomy-level: 2    # L0/L1: any open or rebutted challenge forces human review; L2+: only BLOCKING ones do
  # Agent capability profiles (WI-20): least-privilege per agent; validated at startup,
  # enforced at runtime (tool allow-lists, retrieval corpora, tool-call budgets).
  # Unknown tool/view/corpus references fail the boot. Agents with no profile are denied.
  capabilities:
    version: cap-2026.1
    profiles:
      loan-investigator:
        data-views: [loan-application]
        tools: [loan.documents.v1, loan.sources.v1]
        max-tool-calls: 2
        output-schema: Proposal
      intake:
        data-views: [loan-application]
        output-schema: AgentReport
      kyc:
        data-views: [loan-application, kyc-case]
        tools: [sanctions.screen, sanctions.pep]
        max-tool-calls: 4
        output-schema: AgentReport
      credit-risk:
        data-views: [loan-application]
        tools: [bureau.credit-report, bureau.public-records, income.verify-employment, employment.lookup]
        max-tool-calls: 6
        output-schema: AgentReport
      compliance:
        data-views: [loan-application]
        retrieval: [policies]
        output-schema: AgentReport
      decision:
        data-views: [loan-application]
        output-schema: FinalDecision
      planner:
        data-views: [loan-application]
        output-schema: PlanOutput
      critic:
        data-views: [loan-application]
        output-schema: CritiqueReport
      incident-triage:
        data-views: [incident-case]
        output-schema: IncidentTriage
      incident-diagnosis:
        data-views: [incident-case]
        tools: [ops.metrics.query, ops.logs.query]
        max-tool-calls: 3
        retrieval: [runbooks]
        output-schema: DiagnosisReport
      incident-remediation:
        data-views: [incident-case]
        output-schema: RemediationPlan
      grievance-triage:
        data-views: [grievance-case]
        output-schema: GrievanceTriage
      grievance-response:
        data-views: [grievance-case]
        retrieval: [grievance-playbooks]
        output-schema: GrievanceResponseDraft
      document-analysis:
        data-views: [document-set]
        output-schema: DocumentAnalysis
      document-chunk:
        data-views: [document-set]
        output-schema: ChunkSummary
  policy:
    loan:
      version: loan-policy-2026.1
      apr-base: 6.5
      apr-risk-divisor: 10
      apr-cap: 36.0
      warn-review-count: 2
      risk-review-threshold: 60
      risk-review-metric: max   # Spec Question: v3 says avg; current prompt behaviour is any-score (max)
      max-amount: 100000
      max-term-months: 84
      sanctions-agent: kyc
      data-gap-agents: intake
    incident:
      min-confidence-pct: 50
      max-auto-blast-radius: 2
      min-tier-for-auto-in-production: 3
      change-freeze-enabled: false
      freeze-days-utc: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      freeze-start-utc: "00:00"
      freeze-end-utc: "00:00"
      autonomy-regression-window: 25
      autonomy-regression-min-samples: 8
      autonomy-regression-min-auto-rate: 0.55
  autonomy:
    incident:
      default:
        level: L1
      sev3:
        level: L2
      sev4:
        level: L2
      security:
        level: L1
  incident:
    ingestion:
      enabled: true
      max-queue-size: 1000
      max-batch-per-run: 20
      correlation-window-minutes: 10
      worker-interval-ms: 5000

# Per-agent model routing - swap freely between NIM catalog models
agents:
  models:
    # Lightning is the verified working route for this account. Keep all agents on it
    # as primary for deterministic demos; premium 70B is retained as fallback.
    planner: nvidia/nemotron-3.5-lightning-30b-a3b
    intake: nvidia/nemotron-3.5-lightning-30b-a3b
    kyc: nvidia/nemotron-3.5-lightning-30b-a3b
    credit-risk: nvidia/nemotron-3.5-lightning-30b-a3b
    compliance: nvidia/nemotron-3.5-lightning-30b-a3b
    decision: nvidia/nemotron-3.5-lightning-30b-a3b
    critic: nvidia/nemotron-3.5-lightning-30b-a3b
    incident-triage: nvidia/nemotron-3.5-lightning-30b-a3b
    incident-diagnosis: nvidia/nemotron-3.5-lightning-30b-a3b
    incident-remediation: nvidia/nemotron-3.5-lightning-30b-a3b
    grievance-triage: nvidia/nemotron-3.5-lightning-30b-a3b
    grievance-response: nvidia/nemotron-3.5-lightning-30b-a3b
    document-analysis: nvidia/nemotron-3.5-lightning-30b-a3b
    document-chunk: nvidia/nemotron-3.5-lightning-30b-a3b
  # FinOps: ILLUSTRATIVE USD per 1K tokens - replace with your contracted rates
  pricing:
    "[nvidia/llama-3.1-nemotron-70b-instruct]": {input-per1k: 0.0006, output-per1k: 0.0008}
    "[nvidia/nemotron-3.5-lightning-30b-a3b]": {input-per1k: 0.0002, output-per1k: 0.0005}
    "[nvidia/nemotron-3-super-120b-a12b]": {input-per1k: 0.0007, output-per1k: 0.0012}
  # If an agent's primary model fails or is unavailable, retry through the same
  # account-verified Lightning route. Premium 70B remains configurable for accounts
  # where NVIDIA enables it, but it must not be the fallback for this environment.
  fallback-model: nvidia/nemotron-3.5-lightning-30b-a3b
  # Early-exit: skip remaining agents when a FAIL report's riskScore >= threshold
  fail-fast-threshold: 85
  # Dynamic LLM planning of the execution DAG (falls back to static plan on bad output)
  planner-enabled: false   # rule-based plan by default; true = LLM planner (validated, falls back to rules)
  # Telemetry-driven incident detection: open an incident when an endpoint's 5xx
  # ratio breaches the threshold (min-samples guards against small-sample noise)
  anomaly:
    enabled: ${ANOMALY_WATCHER_ENABLED:true}
    interval-ms: 30000
    min-samples: 20
    error-rate-threshold: 0.25
    cooldown-minutes: 5
  # Compliance RAG: keyword (offline, default) | vector (NIM embeddings, needs API key)
  rag-mode: keyword
  # WI-05 bounded tool-use mode per agent (default keeps deterministic evidence mode)
  tool-use-mode:
    incident-diagnosis: deterministic-evidence
  # RAG v2 (WI-08): minimum IDF-weighted score; weak boilerplate-only matches are dropped
  rag-min-score: 1.0
  # Reflection loop: max times the decision agent revises after critic feedback
  max-revisions: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    io.github.chdurai.agenticbanking: INFO
    org.springframework.ai: INFO
